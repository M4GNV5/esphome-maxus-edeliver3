# Hotspot-only build of maxus-edeliver3-uds.yaml (passive + UDS) for logging on the road,
# e.g. while driving. Same as maxus-edeliver3-charger.yaml, but with UDS polling.
# No home WiFi configured: the hotspot "maxus Fallback AP" starts right after boot
# and stays up. MQTT is configured but has no reachable broker, which is harmless
# (reboot_timeout: 0s).
#
# The CAN log also contains the UDS requests (0x748) and responses (0x7C8).

packages:
  base: !include maxus-edeliver3-uds.yaml

wifi:
  ssid: !remove
  password: !remove
  power_save_mode: none   # max WiFi throughput for the CAN log

# The captive portal would answer *every* GET request while the hotspot is the only
# network (including the web UI and /events), so the CAN log would not work.
captive_portal: !remove
